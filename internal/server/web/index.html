<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Keelwatch</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <div class="brand big"><span class="mark" aria-hidden="true"></span>Keelwatch</div>
    <p class="muted">Docker security posture for this host.</p>
    <label for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit" class="btn primary">Sign in</button>
    <p id="login-err" class="err" role="alert"></p>
    <p class="muted small">First run? The password is printed once in the container log: <code>docker logs keelwatch</code></p>
  </form>
</div>

<div id="app" class="shell" hidden>
  <nav class="side" aria-label="Main">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Keelwatch</span></div>
    <a href="#/" data-route="overview"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 18 0"/><path d="M12 12l4-4"/><path d="M3 17h18"/></svg><span>Overview</span></a>
    <a href="#/findings" data-route="findings"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h6"/></svg><span>Findings</span><em id="nav-findings"></em></a>
    <a href="#/containers" data-route="containers"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="1"/><path d="M7 7v12M11 7v12M15 7v12"/></svg><span>Containers</span></a>
    <a href="#/images" data-route="images"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span>Images</span></a>
    <a href="#/runtime" data-route="runtime"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Runtime</span><em id="nav-alerts"></em></a>
    <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>Settings</span></a>
    <div class="side-foot muted small" id="version"></div>
  </nav>
  <main>
    <header class="top">
      <div>
        <h1 id="page-title">Overview</h1>
        <div class="muted small" id="scan-meta">Waiting for first scan…</div>
      </div>
      <div class="top-actions">
        <span id="demo-badge" class="pill info" hidden>Demo data</span>
        <button id="scan-btn" class="btn">Scan now</button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" aria-label="Close">✕</button></div><div id="modal-body"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
